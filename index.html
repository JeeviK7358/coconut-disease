<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coconut AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Overlay -->
    <div class="background-overlay"></div>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            🌴 COCONUT AI
        </div>

        <div class="nav-right">

            <select id="languageSelect">
                <option value="en">English</option>
                <option value="ta">தமிழ்</option>
            </select>

            <button id="homeButton">
                HOME
            </button>

        </div>

    </header>


    <!-- Main Home Section -->
    <main class="home">

        <!-- Circular Heading -->
        <div class="circle-container">

            <div class="circle">

                <span class="small-title">
                    AI POWERED
                </span>

                <h1>
                    COCONUT AI
                </h1>

                <p>
                    Smart Coconut Tree
                    Disease Detection
                </p>

            </div>

        </div>


        <!-- Main Description -->
        <section class="hero-content">

            <h2>
                Detect Coconut Diseases
                <span>Instantly</span>
            </h2>

            <p>
                Analyze your coconut tree using
                live camera or upload an image.
                Our AI system identifies possible
                diseases and provides detailed results.
            </p>

            <button id="startButton" class="start-button">
                START SCANNING
                <span>→</span>
            </button>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
